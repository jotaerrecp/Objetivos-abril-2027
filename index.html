<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE GESTIÓN Y SEGUIMIENTO INTEGRAL</title>
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1a1a1a;
            --bg-input: #1e1e1e;
            --border-color: #2a2a2a;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding-bottom: 30px;
        }

        /* HEADER GOOGLE SYNC */
        .sync-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .sync-status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-google {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* APP HEADER */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
            font-weight: 700;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 20px 0 10px 5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.1s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .card-icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .card-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-amount {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }
        .text-blue { color: var(--accent-blue); }

        /* CHECKBOX DEREECHA */
        .custom-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .custom-checkbox.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .custom-checkbox.checked::after {
            content: '✓';
            color: #000;
            font-weight: bold;
            font-size: 14px;
        }

        .sub-items {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sub-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .sub-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BALANCE FINAL */
        .balance-container {
            margin-top: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .balance-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- BARRA DE SINCRONIZACIÓN GOOGLE DRIVE -->
        <div class="sync-header">
            <span id="sync-status" class="sync-status">Desconectado</span>
            <button id="auth-btn" class="btn-google" onclick="handleAuthClick()">Iniciar sesión con Google</button>
        </div>

        <header>
            <h1>Objetivos y Finanzas</h1>
        </header>

        <main id="app-content">
            <!-- La estructura de la aplicación se renderizará exactamente igual -->
        </main>

        <div class="balance-container">
            <div class="balance-title">Balance Final Restante</div>
            <div
