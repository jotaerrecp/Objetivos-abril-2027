<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Objetivos y Finanzas</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --card-bg-hover: #222222;
            --accent-color: #2563eb;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #27272a;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sync-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        button.btn-google {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.btn-google:hover {
            opacity: 0.9;
        }

        .category-block {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .category-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .goal-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .goal-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .goal-amount {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checkbox-right {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .balance-footer {
            margin-top: 10px;
            padding: 20px;
            background: #111111;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-label {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .balance-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--success-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">Mis Objetivos</div>
            <div class="user-status">
                <span id="sync-status" class="sync-badge">Desconectado</span>
                <button id="auth-btn" class="btn-google" onclick="handleAuthClick()">Iniciar sesión con Google</button>
            </div>
        </header>

        <main id="goals-container">
            <!-- Los objetivos se cargan automáticamente desde los datos guardados -->
        </main>

        <div class="balance-footer">
            <span class="balance-label">Balance Total</span>
            <span id="total-balance" class="balance-value">$0.00</span>
        </div>
    </div>

    <script>
        const CLIENT_ID = '411382560644-hcrdoss0ihclipn80iqk9i3p1hccprcm.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gsiInited = false;

        // Datos iniciales de fallback
        let appData = {
            categories: [
                {
                    name: "Objetivos Principales",
                    goals: [
                        { id: 1, title: "Fondo de Emergencia", amount: 1000, completed: false },
                        { id: 2, title: "Ahorro Inversiones", amount: 2500, completed: false }
                    ]
                }
            ]
        };

        function gapiLoaded() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                });
                gapiInited = true;
                checkAuth();
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '',
            });
            gsiInited = true;
            checkAuth();
        }

        function checkAuth() {
            if (gapiInited && gsiInited) {
                const token = localStorage.getItem('gdrive_token');
                if (token) {
                    gapi.client.setToken({ access_token: token });
                    updateSyncUI(true);
                    loadDataFromDrive();
                } else {
                    renderGoals();
                }
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) throw (resp);
                localStorage.setItem('gdrive_token', resp.access_token);
                updateSyncUI(true);
                await loadDataFromDrive();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        function updateSyncUI(isLoggedIn) {
            const btn = document.getElementById('auth-btn');
            const status = document.getElementById('sync-status');
            if (isLoggedIn) {
                btn.innerText = 'Cerrar sesión';
                btn.onclick = logout;
                status.innerText = 'Conectado a Google Drive';
                status.style.color = '#22c55e';
            } else {
                btn.innerText = 'Iniciar sesión con Google';
                btn.onclick = handleAuthClick;
                status.innerText = 'Desconectado';
                status.style.color = '#9ca3af';
            }
        }

        function logout() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                localStorage.removeItem('gdrive_token');
                updateSyncUI(false);
            }
        }

        async function loadDataFromDrive() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: "name = 'objetivos-data.json' and trashed = false",
                    fields: 'files(id, name)',
                });
                const files = response.result.files;
                if (files && files.length > 0) {
                    const fileId = files[0].id;
                    const res = await gapi.client.drive.files.get({
                        fileId: fileId,
                        alt: 'media'
                    });
                    if (res.result) {
                        appData = res.result;
                    }
                } else {
                    await saveDataToDrive();
                }
                renderGoals();
            } catch (err) {
                console.error("Error al cargar datos desde Google Drive", err);
                renderGoals();
            }
        }

        async function saveDataToDrive() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: "name = 'objetivos-data.json' and trashed = false",
                    fields: 'files(id, name)',
                });
                const files = response.result.files;
                const fileContent = JSON.stringify(appData, null, 2);

                if (files && files.length > 0) {
                    const fileId = files[0].id;
                    await gapi.client.request({
                        path: '/upload/drive/v3/files/' + fileId,
                        method: 'PATCH',
                        params: { uploadType: 'media' },
                        body: fileContent
                    });
                } else {
                    await gapi.client.drive.files.create({
                        resource: { name: 'objetivos-data.json', mimeType: 'application/json' },
                        media: { mimeType: 'application/json', body: fileContent },
                        fields: 'id'
                    });
                }
                document.getElementById('sync-status').innerText = 'Guardado ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch (err) {
                console.error("Error al guardar en Google Drive", err);
            }
        }

        function toggleGoal(goalId) {
            appData.categories.forEach(cat => {
                cat.goals.forEach(goal => {
                    if (goal.id === goalId) {
                        goal.completed = !goal.completed;
                    }
                });
            });
            renderGoals();
            if (localStorage.getItem('gdrive_token')) {
                saveDataToDrive();
            }
        }

        function renderGoals() {
            const container = document.getElementById('goals-container');
            container.innerHTML = '';
            let totalBalance = 0;

            if (!appData.categories || appData.categories.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No hay objetivos registrados.</p>';
                return;
            }

            appData.categories.forEach(category => {
                const catBlock = document.createElement('div');
                catBlock.className = 'category-block';

                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerText = category.name;
                catBlock.appendChild(catHeader);

                category.goals.forEach(goal => {
                    if (goal.completed) {
                        totalBalance += Number(goal.amount || 0);
                    }

                    const goalItem = document.createElement('div');
                    goalItem.className = 'goal-item';

                    goalItem.innerHTML = `
                        <div class="goal-info">
                            <span class="goal-title">${goal.title}</span>
                            <span class="goal-amount">$${Number(goal.amount || 0).toLocaleString()}</span>
                        </div>
                        <input type="checkbox" class="checkbox-right" ${goal.completed ? 'checked' : ''} onchange="toggleGoal(${goal.id})">
                    `;

                    catBlock.appendChild(goalItem);
                });

                container.appendChild(catBlock);
            });

            document.getElementById('total-balance').innerText = '$' + totalBalance.toLocaleString();
        }
    </script>
    <script src="https://apis.google.com/js/api.js?onload=gapiLoaded"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
</body>
</html>
