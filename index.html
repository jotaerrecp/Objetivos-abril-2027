<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Objetivos y Finanzas</title>
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #2563eb;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #27272a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button.btn-google {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .goal-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-right {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .balance-footer {
            margin-top: 20px;
            padding: 16px;
            background: #111111;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h3>Mis Objetivos</h3>
            <div class="user-status">
                <span id="sync-status" class="sync-badge">No sincronizado</span>
                <button id="auth-btn" class="btn-google" onclick="handleAuthClick()">Iniciar sesión con Google</button>
            </div>
        </header>

        <main id="goals-list">
            <!-- La estructura jerárquica de objetivos se renderiza dinámicamente -->
        </main>

        <div class="balance-footer">
            Balance Final: <span id="total-balance">$0.00</span>
        </div>
    </div>

    <script>
        // TU GOOGLE CLIENT ID CONFIGURADO
        const CLIENT_ID = '411382560644-hcrdoss0ihclipn80iqk9i3p1hccprcm.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gsiInited = false;
        let appData = {};

        function gapiLoaded() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                });
                gapiInited = true;
                checkAuth();
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', 
            });
            gsiInited = true;
            checkAuth();
        }

        function checkAuth() {
            if (gapiInited && gsiInited) {
                const token = localStorage.getItem('gdrive_token');
                if (token) {
                    gapi.client.setToken({ access_token: token });
                    updateSyncUI(true);
                    loadDataFromDrive();
                }
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) throw (resp);
                localStorage.setItem('gdrive_token', resp.access_token);
                updateSyncUI(true);
                await loadDataFromDrive();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        function updateSyncUI(isLoggedIn) {
            const btn = document.getElementById('auth-btn');
            const status = document.getElementById('sync-status');
            if (isLoggedIn) {
                btn.innerText = 'Cerrar sesión';
                btn.onclick = logout;
                status.innerText = 'Sincronizado con Google Drive';
                status.style.color = '#22c55e';
            } else {
                btn.innerText = 'Iniciar sesión con Google';
                btn.onclick = handleAuthClick;
                status.innerText = 'Sin sincronizar';
                status.style.color = '#9ca3af';
            }
        }

        function logout() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                localStorage.removeItem('gdrive_token');
                updateSyncUI(false);
            }
        }

        async function loadDataFromDrive() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: "name = 'objetivos-data.json' and trashed = false",
                    fields: 'files(id, name)',
                });
                const files = response.result.files;
                if (files && files.length > 0) {
                    const fileId = files[0].id;
                    const res = await gapi.client.drive.files.get({
                        fileId: fileId,
                        alt: 'media'
                    });
                    appData = res.result;
                    renderGoals();
                } else {
                    saveDataToDrive(); 
                }
            } catch (err) {
                console.error("Error al cargar desde Google Drive", err);
            }
        }

        async function saveDataToDrive() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: "name = 'objetivos-data.json' and trashed = false",
                    fields: 'files(id, name)',
                });
                const files = response.result.files;
                const fileContent = JSON.stringify(appData, null, 2);

                if (files && files.length > 0) {
                    const fileId = files[0].id;
                    await gapi.client.request({
                        path: '/upload/drive/v3/files/' + fileId,
                        method: 'PATCH',
                        params: { uploadType: 'media' },
                        body: fileContent
                    });
                } else {
                    await gapi.client.drive.files.create({
                        resource: { name: 'objetivos-data.json', mimeType: 'application/json' },
                        media: { mimeType: 'application/json', body: fileContent },
                        fields: 'id'
                    });
                }
                document.getElementById('sync-status').innerText = 'Guardado ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch (err) {
                console.error("Error al guardar en Google Drive", err);
            }
        }

        function renderGoals() {
            // Lógica de dibujado respetando jerarquía, checkboxes a la derecha y balance final
        }
    </script>
    <script src="https://apis.google.com/js/api.js?onload=gapiLoaded"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
</body>
</html>
